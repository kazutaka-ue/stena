<body>
  <main class="section">
    <div class="wrap">
      <header class="head">
        <h1>水を加熱し、<br><em>水蒸気に変えて届ける。</em></h1>
        <p class="lead">超音波式が水を液体のまま霧化して放出するのに対し、STENAが選んだのは、水滴を直接噴霧しないスチーム式。<br>加湿の量だけではなく、床や家具を濡らしにくい、空気への届け方まで考えました。</p>
      </header>

      <section class="compare" aria-label="超音波式とスチーム式の比較">
        <article class="card">
          <div class="topline"><span class="tag">超音波式</span></div>
          <div class="visual" aria-hidden="true">
            <div class="mist"></div>
            <div class="droplet-zone">
            <div class="drop-cluster"></div>
